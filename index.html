<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#152c3b">
<title>AMINE DH | Boutique officielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--gold:#c9a34e;--dark:#152c3b;--green:#244b50;--cream:#f8f6ec;--white:#fff;--muted:#777;--border:#e8e2d4;--danger:#c93636}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:var(--cream);color:var(--dark);padding-bottom:85px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.container{max-width:1100px;margin:auto}
header{padding:20px 16px}
.brand{display:flex;justify-content:center;align-items:center;gap:14px}
.logo{font-size:42px;font-weight:800;color:var(--gold);border-right:2px solid var(--gold);padding-right:12px;letter-spacing:-3px}
.brand-name{font-size:clamp(23px,5vw,35px);font-weight:800}
.brand-subtitle{font-size:10px;letter-spacing:2px}
.search{display:flex;margin:10px 15px 20px;background:white;border:1px solid var(--border);border-radius:16px;padding:7px 12px}
.search input{flex:1;min-width:0;border:0;outline:0;padding:12px}
.search button{border:0;background:none;color:var(--gold);font-size:24px}
.categories{display:flex;overflow-x:auto;background:white;scrollbar-width:none;border-block:1px solid var(--border)}
.categories button{flex:1;min-width:100px;padding:12px 8px;border:0;border-right:1px solid var(--border);background:white;color:var(--dark);font-size:12px}
.categories button span{display:block;font-size:25px;margin-bottom:4px}
.categories button.active{background:#f0e5c7;box-shadow:inset 0 -3px var(--gold)}
.hero{margin:25px 15px;padding:35px 24px;min-height:310px;border-radius:26px;color:white;background:radial-gradient(circle at 15% 20%,#668985,transparent 45%),linear-gradient(135deg,#456b6e,#193b42);display:flex;align-items:center;position:relative;overflow:hidden}
.hero-content{position:relative;z-index:1;width:100%;text-align:right}
.hero-label{display:inline-block;padding:9px 14px;border-radius:20px;background:#193f43;color:#f1d991;font-size:11px;margin-bottom:20px}
.hero h1{font-size:clamp(27px,5vw,43px);line-height:1.5;margin-bottom:12px}
.hero h1 span{color:#e2c36f}
.hero p{font-size:14px;color:#e5e9e2;margin-bottom:20px}
.primary,.gold-button{border:0;border-radius:12px;padding:13px 18px;font-weight:700}
.primary{background:var(--dark);color:white}
.gold-button{background:linear-gradient(120deg,#e7ca75,#c79b37);color:#202b2d}
.section{padding:20px 15px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.section-heading h2{font-size:22px}
.text-button{border:0;background:none;color:#a47c29;font-size:12px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product{background:white;border:1px solid var(--border);border-radius:17px;overflow:hidden;min-width:0}
.product-image{position:relative;height:175px;background:#f0eee5;display:grid;place-items:center}
.product-image img{width:100%;height:100%;object-fit:contain;padding:10px}
.placeholder{font-size:55px}
.favorite{position:absolute;top:8px;right:8px;width:35px;height:35px;border:0;border-radius:50%;background:white;font-size:20px;color:var(--danger)}
.product-info{padding:13px}
.product-info h3{font-size:13px;line-height:1.7;margin-bottom:7px}
.description{color:var(--muted);font-size:11px;line-height:1.7;margin-bottom:8px}
.price{color:#a47c29;font-weight:800;font-size:16px;margin-bottom:12px}
.product-info .primary{width:100%;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:35px 10px;color:var(--muted)}
.status{font-size:12px;padding:12px;text-align:center;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.panel{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:22px}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.close{border:0;background:#eee;border-radius:50%;width:36px;height:36px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;outline-color:var(--gold);background:white}
.field textarea{min-height:75px;resize:vertical}
.cart-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-row-info{flex:1;min-width:0}
.cart-row-info strong{display:block;font-size:13px}
.cart-row-info small{color:var(--muted)}
.quantity{display:flex;align-items:center;gap:9px}
.quantity button{width:28px;height:28px;border:0;border-radius:7px;background:#eee}
.remove{border:0;background:none;color:var(--danger);padding:5px}
.total{display:flex;justify-content:space-between;gap:10px;padding:18px 0;font-weight:800;font-size:17px}
.full{width:100%;margin-top:8px}
.bottom-nav{position:fixed;z-index:50;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom));background:#fffdf5;border-top:1px solid var(--border);box-shadow:0 -5px 20px #00000008}
.nav-item{flex:1;border:0;background:none;color:#77756e;font-size:10px}
.nav-icon{display:block;font-size:23px;margin-bottom:3px}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:50%;background:var(--danger);color:white;font-size:10px;vertical-align:top;margin-left:2px}
.toast{display:none;position:fixed;z-index:200;bottom:95px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 18px;border-radius:12px;font-size:12px;width:max-content;max-width:90%}
footer{text-align:center;padding:25px 10px;color:var(--muted);font-size:11px}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0}
@media(min-width:700px){
body{background:#ecebe5}
.container{background:var(--cream);min-height:100vh;box-shadow:0 0 35px #00000008}
.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.product-image{height:220px}
.hero{min-height:350px}
.overlay{align-items:center}
.panel{border-radius:20px}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="brand">
    <div class="logo">ADH</div>
    <div>
      <div class="brand-name">AMINE DH</div>
      <div class="brand-subtitle">E-COMMERCE GLOBAL STORE</div>
    </div>
  </div>
</header>

<form class="search" id="searchForm">
  <input id="searchInput" type="search" placeholder="Rechercher un produit..." aria-label="Rechercher un produit">
  <button type="submit" aria-label="Rechercher">⌕</button>
</form>

<nav class="categories" id="categories">
  <button class="active" data-category="all"><span>🛍️</span>Tout</button>
  <button data-category="Cuisine"><span>🍳</span>Cuisine</button>
  <button data-category="Électronique"><span>🎧</span>Électronique</button>
  <button data-category="Informatique"><span>💻</span>Informatique</button>
  <button data-category="Accessoires"><span>⌚</span>Accessoires</button>
  <button data-category="Téléphones"><span>📱</span>Téléphones</button>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="hero-label">BIENVENUE CHEZ AMINE DH</div>
    <h1>TOUT CE DONT<br>VOUS AVEZ BESOIN,<br><span>AU MÊME ENDROIT !</span></h1>
    <p>Découvrez notre sélection de produits.</p>
    <button class="gold-button" id="discoverButton">Découvrir les produits →</button>
  </div>
</section>

<div class="section" style="padding-top:0;padding-bottom:0">
  <button class="gold-button full" id="addProductButton" type="button">＋ Ajouter un produit à la boutique</button>
</div>

<section class="section" id="productsSection">
  <div class="section-heading">
    <h2>Nos produits</h2>
    <button class="text-button" id="resetFilters">Tout afficher ↗</button>
  </div>
  <div class="status" id="loadStatus">Connexion à la boutique...</div>
  <div class="products" id="products"></div>
</section>

<footer>© <span id="year"></span> AMINE DH — Tous droits réservés.</footer>
</div>

<nav class="bottom-nav">
  <button class="nav-item" data-action="home"><span class="nav-icon">⌂</span>Accueil</button>
  <button class="nav-item" data-action="account"><span class="nav-icon">♙</span>Compte</button>
  <button class="nav-item" data-action="orders"><span class="nav-icon">▣</span>Commandes</button>
  <button class="nav-item" data-action="wishlist"><span class="nav-icon">♡</span>Favoris <span class="badge" id="wishCount">0</span></button>
  <button class="nav-item" data-action="cart"><span class="nav-icon">🛒</span>Panier <span class="badge" id="cartCount">0</span></button>
</nav>

<div class="overlay" id="panelOverlay">
  <div class="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Panier</h2>
      <button class="close" id="closePanel" aria-label="Fermer">✕</button>
    </div>
    <div id="panelContent"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* إعدادات Supabase العامة فقط. لا تضع service_role key في هذا الملف. */
const SUPABASE_URL = "https://dsdsphbldkmirrcxvwwj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZyLJneC_AFCb2YLdfPwdfW_-DKKY90V";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const productsElement = $("products");
const panelOverlay = $("panelOverlay");
const panelContent = $("panelContent");

let products = [];
let cart = [];
let wishlist = [];
let selectedCategory = "all";
let searchTerm = "";
let toastTimer = null;
let currentUser = null;

try {
  cart = JSON.parse(localStorage.getItem("amine_cart") || "[]");
  wishlist = JSON.parse(localStorage.getItem("amine_wishlist") || "[]");
  if (!Array.isArray(cart)) cart = [];
  if (!Array.isArray(wishlist)) wishlist = [];
} catch {
  cart = [];
  wishlist = [];
}

function escapeHTML(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function money(v) {
  return new Intl.NumberFormat("fr-DZ", {maximumFractionDigits:2}).format(Number(v) || 0) + " DA";
}

function toast(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").style.display = "none", 3000);
}

function save() {
  localStorage.setItem("amine_cart", JSON.stringify(cart));
  localStorage.setItem("amine_wishlist", JSON.stringify(wishlist));
  badges();
}

function badges() {
  $("cartCount").textContent = cart.reduce((s,i) => s + (Number(i.quantity) || 0), 0);
  $("wishCount").textContent = wishlist.length;
}

const pid = p => String(p.id);
const pname = p => p.name ?? p.title ?? "Produit";
const price = p => Number(p.price ?? 0);
const image = p => p.image_url ?? "";
const category = p => p.category ?? p.category_name ?? "";
const desc = p => p.description ?? "";

function available(p) {
  return p.is_active !== false &&
    p.status !== "inactive" &&
    p.status !== "draft" &&
    Number(p.stock ?? 1) > 0;
}

async function loadProducts() {
  $("loadStatus").textContent = "Chargement des produits...";
  try {
    const {data, error} = await db.from("products")
      .select("id,store_id,name,description,price,image_url,stock,is_active,created_at,category")
      .eq("is_active", true)
      .limit(100);

    if (error) throw error;

    products = (data || []).filter(available);
    $("loadStatus").textContent = products.length
      ? `${products.length} produit(s) disponible(s)`
      : "Aucun produit publié pour le moment.";

    renderProducts();
  } catch (e) {
    console.error(e);
    $("loadStatus").textContent = "Impossible de charger les produits. Vérifiez les autorisations Supabase.";
    productsElement.innerHTML = '<div class="empty">Les produits ne sont pas disponibles pour le moment.</div>';
  }
}

function renderProducts() {
  const filtered = products.filter(p =>
    (selectedCategory === "all" ||
     category(p).toLocaleLowerCase("fr") === selectedCategory.toLocaleLowerCase("fr")) &&
    (pname(p) + " " + desc(p) + " " + category(p))
      .toLocaleLowerCase("fr").includes(searchTerm.toLocaleLowerCase("fr"))
  );

  if (!filtered.length) {
    productsElement.innerHTML = '<div class="empty">Aucun produit trouvé.<br>Essayez une autre recherche.</div>';
    return;
  }

  productsElement.innerHTML = filtered.map(p => {
    const id = pid(p);
    const img = image(p);
    return `
      <article class="product">
        <div class="product-image">
          ${img ? `<img src="${escapeHTML(img)}" alt="${escapeHTML(pname(p))}" loading="lazy" onerror="this.style.display='none'">` : ""}
          <span class="placeholder" ${img ? 'style="display:none"' : ""}>🛍️</span>
          <button class="favorite" data-favorite="${escapeHTML(id)}">${wishlist.includes(id) ? "♥" : "♡"}</button>
        </div>
        <div class="product-info">
          <h3>${escapeHTML(pname(p))}</h3>
          <p class="description">${escapeHTML(desc(p).slice(0,100))}</p>
          <div class="price">${money(price(p))}</div>
          <button class="primary" data-add="${escapeHTML(id)}">Ajouter au panier</button>
        </div>
      </article>`;
  }).join("");
}

function addToCart(id) {
  const p = products.find(x => pid(x) === String(id));
  if (!p) return;

  const item = cart.find(x => String(x.id) === String(id));
  if (item) item.quantity = Math.min((Number(item.quantity) || 0) + 1, Number(p.stock) || 99);
  else cart.push({id:String(id), quantity:1});

  save();
  toast("Produit ajouté au panier !");
}

function toggleWish(id) {
  id = String(id);
  wishlist = wishlist.includes(id)
    ? wishlist.filter(x => x !== id)
    : [...wishlist, id];

  save();
  renderProducts();

  if (panelOverlay.classList.contains("open") &&
      $("panelTitle").textContent === "Mes favoris") {
    renderWishlist();
  }
}

function openPanel(title, html) {
  $("panelTitle").textContent = title;
  panelContent.innerHTML = html;
  panelOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePanel() {
  panelOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

function cartDetails() {
  return cart.map(i => {
    const p = products.find(x => pid(x) === String(i.id));
    return p ? {...p, quantity:Number(i.quantity) || 1} : null;
  }).filter(Boolean);
}

function renderCart() {
  const items = cartDetails();

  if (!items.length) {
    openPanel("Mon panier", '<div class="empty">Votre panier est vide 🛒</div>');
    return;
  }

  const total = items.reduce((s,p) => s + price(p) * p.quantity, 0);

  openPanel("Mon panier",
    items.map(p => `
      <div class="cart-row">
        <div class="cart-row-info">
          <strong>${escapeHTML(pname(p))}</strong>
          <small>${money(price(p))}</small>
        </div>
        <div class="quantity">
          <button data-minus="${pid(p)}">−</button>
          <span>${p.quantity}</span>
          <button data-plus="${pid(p)}">+</button>
        </div>
        <button class="remove" data-remove="${pid(p)}">✕</button>
      </div>`).join("") +
    `<div class="total"><span>Total produits</span><span>${money(total)}</span></div>
     <p class="hint">Les produits de plusieurs boutiques seront envoyés dans des commandes séparées.</p>
     <button class="gold-button full" id="checkoutButton">Commander maintenant</button>`
  );
}

function renderWishlist() {
  const items = products.filter(p => wishlist.includes(pid(p)));

  openPanel("Mes favoris",
    items.length
      ? items.map(p => `
        <div class="cart-row">
          <div class="cart-row-info">
            <strong>${escapeHTML(pname(p))}</strong>
            <small>${money(price(p))}</small>
          </div>
          <button class="primary" data-add="${pid(p)}">Ajouter</button>
          <button class="remove" data-favorite="${pid(p)}">♥</button>
        </div>`).join("")
      : '<div class="empty">Votre liste de favoris est vide ♡</div>'
  );
}

async function getUser() {
  const {data, error} = await db.auth.getUser();
  if (error) console.warn(error);
  currentUser = data?.user || null;
  return currentUser;
}

/* Espace vendeur : ajout d'un produit avec image dans Supabase Storage. */
async function openAddProduct() {
  const user = await getUser();

  if (!user) {
    accountPanel();
    toast("Connectez-vous avec le compte propriétaire de la boutique.");
    return;
  }

  openPanel("Ajouter un produit", '<div class="empty">Vérification de votre boutique...</div>');

  try {
    const {data:store, error} = await db.from("stores")
      .select("id,name,status")
      .eq("owner_id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (!store) {
      openPanel("Boutique introuvable",
        '<p class="hint">Aucune boutique n’est liée à ce compte. Connectez-vous avec le compte propriétaire de la boutique AMINE DH.</p>');
      return;
    }

    const statusNote = store.status === "approved"
      ? "Votre boutique est approuvée."
      : "Votre boutique n’est pas encore approuvée : les produits peuvent rester invisibles aux clients.";

    openPanel("Ajouter un produit", `
      <p class="hint">Boutique : <strong>${escapeHTML(store.name)}</strong>. ${escapeHTML(statusNote)}</p>
      <form id="addProductForm" data-store-id="${escapeHTML(store.id)}">
        <div class="field">
          <label for="newProductName">Nom du produit *</label>
          <input id="newProductName" name="name" required maxlength="150" autocomplete="off">
        </div>
        <div class="field">
          <label for="newProductPrice">Prix (DA) *</label>
          <input id="newProductPrice" name="price" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="field">
          <label for="newProductStock">Quantité disponible *</label>
          <input id="newProductStock" name="stock" type="number" min="0" step="1" value="1" required>
        </div>
        <div class="field">
          <label for="newProductCategory">Catégorie *</label>
          <select id="newProductCategory" name="category" required>
            <option value="Cuisine">Cuisine</option>
            <option value="Électronique">Électronique</option>
            <option value="Informatique">Informatique</option>
            <option value="Accessoires">Accessoires</option>
            <option value="Téléphones">Téléphones</option>
            <option value="Autres">Autres</option>
          </select>
        </div>
        <div class="field">
          <label for="newProductDescription">Description</label>
          <textarea id="newProductDescription" name="description" maxlength="1000" placeholder="Décrivez votre produit..."></textarea>
        </div>
        <div class="field">
          <label for="newProductImage">Photo du produit *</label>
          <input id="newProductImage" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
          <p class="hint">JPG, PNG ou WEBP — maximum 5 Mo.</p>
        </div>
        <button class="gold-button full" type="submit">Publier le produit</button>
      </form>`
    );
  } catch (e) {
    console.error("Store lookup", e);
    openPanel("Erreur",
      `<p class="hint">Impossible de vérifier la boutique. ${escapeHTML(e.message || "Vérifiez les politiques RLS de la table stores.")}</p>`);
  }
}

async function publishProduct(form) {
  const user = await getUser();

  if (!user) {
    toast("Votre session a expiré. Reconnectez-vous.");
    accountPanel();
    return;
  }

  const btn = form.querySelector('button[type="submit"]');
  const name = form.elements.name.value.trim();
  const description = form.elements.description.value.trim();
  const priceValue = Number(form.elements.price.value);
  const stockValue = Number(form.elements.stock.value);
  const categoryValue = form.elements.category.value;
  const file = form.elements.image.files[0];
  const storeId = form.dataset.storeId;

  if (!name || !storeId || !Number.isFinite(priceValue) ||
      priceValue <= 0 || !Number.isInteger(stockValue) || stockValue < 0) {
    toast("Vérifiez le nom, le prix et la quantité.");
    return;
  }

  if (!file) {
    toast("Choisissez une photo du produit.");
    return;
  }

  if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
    toast("Format refusé : utilisez JPG, PNG ou WEBP.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    toast("La photo doit faire 5 Mo maximum.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Publication en cours...";

  try {
    const {data:store, error:storeError} = await db.from("stores")
      .select("id,status")
      .eq("id", storeId)
      .eq("owner_id", user.id)
      .maybeSingle();

    if (storeError) throw storeError;
    if (!store) throw new Error("Cette boutique n'appartient pas au compte connecté.");

    const ext = file.type === "image/png" ? "png" :
                file.type === "image/webp" ? "webp" : "jpg";

    const uploadedPath = `${user.id}/${crypto.randomUUID()}.${ext}`;

    const {error:uploadError} = await db.storage
      .from("product-images")
      .upload(uploadedPath, file, {
        contentType:file.type,
        upsert:false
      });

    if (uploadError) {
      throw new Error("Échec du téléversement de la photo : " + uploadError.message);
    }

    const {data:publicData} = db.storage
      .from("product-images")
      .getPublicUrl(uploadedPath);

    const {error:insertError} = await db.from("products").insert({
      store_id:store.id,
      name,
      description,
      price:priceValue,
      image_url:publicData.publicUrl,
      stock:stockValue,
      is_active:true,
      category:categoryValue
    });

    if (insertError) {
      throw new Error("Photo envoyée, mais produit non enregistré : " + insertError.message);
    }

    toast("Produit publié avec succès !");
    await loadProducts();

    openPanel("Produit publié", `
      <div class="empty">
        <div style="font-size:42px">✅</div>
        <h3>Votre produit est en ligne.</h3>
        <p class="hint">Il a été enregistré dans votre boutique AMINE DH.</p>
      </div>
      <button class="primary full" id="continueShopping">Retour à la boutique</button>
      <button class="gold-button full" id="addAnotherProduct">Ajouter un autre produit</button>
    `);
  } catch (e) {
    console.error("Product publish error", e);
    toast(e.message || "Impossible de publier le produit. Vérifiez les règles Supabase.");
    btn.disabled = false;
    btn.textContent = "Publier le produit";
  }
}

function accountPanel() {
  openPanel("Mon compte", `
    <div id="authState" class="hint">
      ${currentUser
        ? `Connecté : ${escapeHTML(currentUser.email || "compte client")}`
        : "Connectez-vous ou créez un compte pour commander."}
    </div>
    ${currentUser
      ? `<button class="primary full" id="myOrdersButton">Mes commandes</button>
         <button class="gold-button full" id="logoutButton">Se déconnecter</button>`
      : `<form id="authForm">
          <div class="field">
            <label for="authEmail">Adresse e-mail</label>
            <input id="authEmail" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="authPassword">Mot de passe (6 caractères minimum)</label>
            <input id="authPassword" type="password" minlength="6" required autocomplete="current-password">
          </div>
          <div class="field">
            <label for="authName">Nom complet (pour créer un compte)</label>
            <input id="authName" maxlength="100" autocomplete="name">
          </div>
          <button class="primary full" type="submit" name="mode" value="login">Se connecter</button>
          <button class="gold-button full" type="button" id="signupButton">Créer un compte</button>
        </form>
        <p class="hint">Après inscription, confirmez votre e-mail si Supabase vous le demande. Ne partagez jamais votre mot de passe.</p>`
    }`
  );
}

async function signup() {
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const name = $("authName").value.trim();

  if (!email || password.length < 6) {
    toast("Entrez un e-mail valide et un mot de passe d'au moins 6 caractères.");
    return;
  }

  const b = $("signupButton");
  b.disabled = true;

  try {
    const {data,error} = await db.auth.signUp({
      email,
      password,
      options:{data:{full_name:name}}
    });

    if (error) throw error;

    if (data.user && data.session) {
      currentUser = data.user;
      toast("Compte créé. Vérifiez le profil avant de commander.");
      accountPanel();
    } else {
      toast("Inscription envoyée. Vérifiez votre e-mail puis connectez-vous.");
    }
  } catch (e) {
    console.error(e);
    toast("Inscription impossible : " + (e.message || "vérifiez Supabase Auth."));
  } finally {
    if ($("signupButton")) $("signupButton").disabled = false;
  }
}

async function login(form) {
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const b = form.querySelector('button[type="submit"]');
  b.disabled = true;

  try {
    const {data,error} = await db.auth.signInWithPassword({email,password});
    if (error) throw error;

    currentUser = data.user;
    toast("Connexion réussie.");
    accountPanel();
  } catch (e) {
    console.error(e);
    toast("Connexion impossible : vérifiez l'e-mail et le mot de passe.");
  } finally {
    if (b) b.disabled = false;
  }
}

async function logout() {
  const {error} = await db.auth.signOut();
  if (error) {
    toast("Impossible de se déconnecter.");
    return;
  }

  currentUser = null;
  accountPanel();
  toast("Déconnexion réussie.");
}

function checkoutForm() {
  const items = cartDetails();

  if (!items.length) {
    toast("Votre panier est vide.");
    return;
  }

  if (!currentUser) {
    accountPanel();
    toast("Connectez-vous avant de commander.");
    return;
  }

  const total = items.reduce((s,p) => s + price(p) * p.quantity, 0);

  openPanel("Informations de livraison", `
    <form id="checkoutForm">
      <div class="field">
        <label>Nom et prénom *</label>
        <input name="customerName" required maxlength="100" autocomplete="name">
      </div>
      <div class="field">
        <label>Téléphone *</label>
        <input name="customerPhone" required type="tel" maxlength="25" autocomplete="tel">
      </div>
      <div class="field">
        <label>Wilaya *</label>
        <input name="wilaya" required maxlength="80">
      </div>
      <div class="field">
        <label>Commune *</label>
        <input name="city" required maxlength="100">
      </div>
      <div class="field">
        <label>Adresse *</label>
        <textarea name="address" required maxlength="500"></textarea>
      </div>
      <div class="field">
        <label>Remarque (facultatif)</label>
        <textarea name="note" maxlength="500"></textarea>
      </div>
      <div class="total"><span>Total des produits</span><span>${money(total)}</span></div>
      <p class="hint">Paiement à la livraison. Les frais de livraison seront confirmés par le vendeur.</p>
      <button class="gold-button full" type="submit">Confirmer la commande</button>
    </form>`
  );
}

async function submitOrder(form) {
  const btn = form.querySelector('button[type="submit"]');
  if (btn.disabled) return;

  const user = await getUser();
  if (!user) {
    toast("Connectez-vous avant de commander.");
    accountPanel();
    return;
  }

  const items = cartDetails();
  if (!items.length) {
    toast("Votre panier est vide.");
    return;
  }

  const fd = new FormData(form);
  const v = key => String(fd.get(key) || "").trim();

  const name = v("customerName");
  const phone = v("customerPhone");
  const wilaya = v("wilaya");
  const city = v("city");
  const address = v("address");
  const note = v("note");

  if (!name || !phone || !wilaya || !city || !address) {
    toast("Remplissez les champs obligatoires.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Envoi en cours...";

  try {
    const groups = new Map();

    for (const p of items) {
      if (!p.store_id) throw new Error("Un produit n'est pas associé à une boutique.");
      if (!groups.has(p.store_id)) groups.set(p.store_id, []);
      groups.get(p.store_id).push(p);
    }

    const created = [];

    for (const [storeId, group] of groups) {
      const total = group.reduce((s,p) => s + price(p) * p.quantity, 0);

      const payload = {
        customer_id:user.id,
        store_id:storeId,
        customer_name:name,
        phone,
        customer_phone:phone,
        wilaya,
        city,
        address,
        note,
        total,
        status:"pending",
        payment_method:"cash_on_delivery"
      };

      const {data:order,error:oe} = await db.from("orders")
        .insert(payload).select("id,total").single();

      if (oe) throw oe;

      const lines = group.map(p => ({
        order_id:order.id,
        store_id:storeId,
        product_id:p.id,
        product_name:pname(p),
        quantity:p.quantity,
        unit_price:price(p)
      }));

      const {error:ie} = await db.from("order_items").insert(lines);

      if (ie) {
        throw new Error("Commande créée mais détails non enregistrés. Référence : " + order.id);
      }

      created.push(order);
    }

    cart = [];
    save();

    openPanel("Commande reçue", `
      <div class="empty">
        <div style="font-size:48px">✅</div>
        <h3>Merci pour votre commande !</h3>
        <p>${created.length} commande(s) enregistrée(s).</p>
        ${created.map(o => `<p class="hint">Référence : <strong>${escapeHTML(o.id)}</strong> — ${money(o.total)}</p>`).join("")}
        <p>Le vendeur pourra vous contacter pour confirmer la livraison.</p>
      </div>
      <button class="primary full" id="continueShopping">Continuer mes achats</button>`
    );
  } catch (e) {
    console.error("Erreur commande", e);
    toast("Commande non enregistrée : " + (e.message || "vérifiez les autorisations Supabase."));
    btn.disabled = false;
    btn.textContent = "Confirmer la commande";
  }
}

async function showOrders() {
  const user = await getUser();

  if (!user) {
    accountPanel();
    toast("Connectez-vous pour voir vos commandes.");
    return;
  }

  openPanel("Mes commandes", '<div class="empty">Chargement de vos commandes...</div>');

  try {
    const {data,error} = await db.from("orders")
      .select("id,total,status,created_at,store_id")
      .eq("customer_id", user.id)
      .order("created_at", {ascending:false})
      .limit(50);

    if (error) throw error;

    panelContent.innerHTML = data?.length
      ? data.map(o => `
        <div class="cart-row">
          <div class="cart-row-info">
            <strong>Commande ${escapeHTML(o.id.slice(0,8))}</strong>
            <small>${escapeHTML(o.status || "pending")} · ${escapeHTML(new Date(o.created_at).toLocaleDateString("fr-DZ"))}</small>
          </div>
          <strong>${money(o.total)}</strong>
        </div>`).join("")
      : '<div class="empty">Vous n’avez pas encore de commande.</div>';
  } catch (e) {
    console.error(e);
    panelContent.innerHTML = '<div class="empty">Impossible de charger les commandes. Vérifiez les politiques RLS.</div>';
  }
}

/* Recherche et catégories */
$("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  searchTerm = $("searchInput").value.trim();
  renderProducts();
});

$("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  renderProducts();
});

$("categories").addEventListener("click", e => {
  const b = e.target.closest("[data-category]");
  if (!b) return;

  selectedCategory = b.dataset.category;
  document.querySelectorAll(".categories button").forEach(x => x.classList.toggle("active", x === b));
  renderProducts();
});

$("resetFilters").addEventListener("click", () => {
  selectedCategory = "all";
  searchTerm = "";
  $("searchInput").value = "";
  document.querySelectorAll(".categories button").forEach((b,i) => b.classList.toggle("active", i === 0));
  renderProducts();
});

$("addProductButton").addEventListener("click", openAddProduct);
$("discoverButton").addEventListener("click", () => $("productsSection").scrollIntoView({behavior:"smooth"}));

productsElement.addEventListener("click", e => {
  const a = e.target.closest("[data-add]");
  const f = e.target.closest("[data-favorite]");
  if (a) addToCart(a.dataset.add);
  if (f) toggleWish(f.dataset.favorite);
});

document.querySelector(".bottom-nav").addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;

  switch (b.dataset.action) {
    case "home": window.scrollTo({top:0,behavior:"smooth"}); break;
    case "account": accountPanel(); break;
    case "orders": showOrders(); break;
    case "wishlist": renderWishlist(); break;
    case "cart": renderCart(); break;
  }
});

$("closePanel").addEventListener("click", closePanel);

panelOverlay.addEventListener("click", e => {
  if (e.target === panelOverlay) closePanel();
});

panelContent.addEventListener("click", async e => {
  const plus = e.target.closest("[data-plus]");
  const minus = e.target.closest("[data-minus]");
  const remove = e.target.closest("[data-remove]");
  const add = e.target.closest("[data-add]");
  const fav = e.target.closest("[data-favorite]");

  if (plus) {
    const i = cart.find(x => String(x.id) === plus.dataset.plus);
    const p = products.find(x => pid(x) === plus.dataset.plus);
    if (i) i.quantity = Math.min(i.quantity + 1, Number(p?.stock) || 99);
    save();
    renderCart();
  }

  if (minus) {
    const i = cart.find(x => String(x.id) === minus.dataset.minus);
    if (i) {
      i.quantity--;
      if (i.quantity <= 0) cart = cart.filter(x => String(x.id) !== minus.dataset.minus);
    }
    save();
    renderCart();
  }

  if (remove) {
    cart = cart.filter(x => String(x.id) !== remove.dataset.remove);
    save();
    renderCart();
  }

  if (add) addToCart(add.dataset.add);
  if (fav) toggleWish(fav.dataset.favorite);
  if (e.target.closest("#checkoutButton")) checkoutForm();
  if (e.target.closest("#continueShopping")) closePanel();
  if (e.target.closest("#addAnotherProduct")) openAddProduct();
  if (e.target.closest("#signupButton")) signup();
  if (e.target.closest("#logoutButton")) logout();
  if (e.target.closest("#myOrdersButton")) showOrders();
});

panelContent.addEventListener("submit", async e => {
  if (e.target.id === "checkoutForm") {
    e.preventDefault();
    await submitOrder(e.target);
  }

  if (e.target.id === "authForm") {
    e.preventDefault();
    await login(e.target);
  }

  if (e.target.id === "addProductForm") {
    e.preventDefault();
    await publishProduct(e.target);
  }
});

$("year").textContent = new Date().getFullYear();
badges();

db.auth.getSession().then(({data}) => {
  currentUser = data?.session?.user || null;
});

db.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
});

loadProducts();
