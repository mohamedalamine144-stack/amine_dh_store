<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMINE DH | E-Commerce Global Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #c9a34e;
  --dark: #152c3b;
  --cream: #f8f6ec;
  --white: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--cream);
  color: var(--dark);
  padding-bottom: 90px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  max-width: 650px;
  margin: auto;
}

/* LOGO */

.header {
  padding: 25px 18px 20px;
  background: var(--cream);
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.logo {
  color: var(--gold);
  font-size: 58px;
  font-weight: 700;
  letter-spacing: -5px;
  border-right: 2px solid var(--gold);
  padding-right: 12px;
}

.brand-name {
  font-size: clamp(22px, 6vw, 38px);
  font-weight: 800;
  letter-spacing: 1px;
}

.brand-subtitle {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
}

/* SEARCH */

.search-box {
  margin: 15px 15px 20px;
  display: flex;
  align-items: center;
  background: #fff;
  border: 1px solid #e3dfd1;
  border-radius: 22px;
  padding: 8px 15px;
  box-shadow: 0 4px 12px #00000008;
}

.search-box input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  padding: 13px 5px;
  font-size: 15px;
  color: var(--dark);
}

.search-button {
  background: none;
  border: none;
  font-size: 27px;
  color: var(--gold);
}

/* CATEGORIES */

.categories {
  display: flex;
  overflow-x: auto;
  background: #fff;
  border-bottom: 1px solid #e5dfcf;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  min-width: 20%;
  flex: 1;
  text-align: center;
  padding: 12px 5px;
  border: none;
  border-right: 1px solid #e6e1d5;
  background: white;
  color: var(--dark);
  font-size: 12px;
  white-space: nowrap;
}

.category .icon {
  display: block;
  font-size: 28px;
  margin-bottom: 5px;
}

.category.active {
  background: #f0e5c7;
  box-shadow: inset 0 -3px var(--gold);
}

/* HERO BANNER */

.hero {
  margin: 32px 15px 25px;
  min-height: 390px;
  border-radius: 30px;
  background:
    radial-gradient(circle at 20% 20%, #678985, transparent 45%),
    linear-gradient(135deg, #456b6e, #244b50);
  position: relative;
  overflow: hidden;
  color: white;
  padding: 32px 23px;
  display: flex;
  align-items: center;
}

.hero::before {
  content: "";
  position: absolute;
  width: 230px;
  height: 500px;
  border: 2px solid #d6b55e;
  border-radius: 50%;
  left: -145px;
  top: -60px;
  transform: rotate(15deg);
  opacity: .8;
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: right;
}

.hero-label {
  display: inline-block;
  background: #193f43;
  color: #e9d28d;
  padding: 12px 16px;
  border-radius: 25px;
  font-size: 12px;
  margin-bottom: 25px;
  box-shadow: 0 5px 15px #00000020;
}

.hero h1 {
  font-size: clamp(27px, 6vw, 38px);
  line-height: 1.65;
  font-weight: 800;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #e2c36f;
}

.hero p {
  color: #e6e8df;
  font-size: 14px;
  margin-bottom: 24px;
}

.hero-button {
  display: inline-block;
  background: linear-gradient(120deg, #e7ca75, #c79b37);
  color: #202b2d;
  border: none;
  padding: 14px 22px;
  border-radius: 15px;
  font-weight: 700;
  box-shadow: 0 5px 12px #00000020;
}

.shopping-bags {
  position: absolute;
  left: 15px;
  top: 105px;
  font-size: 75px;
  filter: drop-shadow(0 10px 10px #00000020);
}

/* PRODUCTS */

.products-section {
  padding: 15px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-header h2 {
  font-size: 22px;
}

.section-header a {
  color: #a47c29;
  font-size: 13px;
  text-decoration: none;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.product {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #eee8d9;
  box-shadow: 0 5px 15px #00000005;
}

.product-image {
  height: 165px;
  display: grid;
  place-items: center;
  background: #f1efe6;
  position: relative;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
}

.product-placeholder {
  font-size: 60px;
}

.product-info {
  padding: 13px;
}

.product-info h3 {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 7px;
}

.product-price {
  color: #a47c29;
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 12px;
}

.add-cart {
  width: 100%;
  padding: 10px;
  border: none;
  background: var(--dark);
  color: white;
  border-radius: 10px;
  font-size: 12px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px 10px;
  color: #777;
  line-height: 2;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
  position: fixed;
  z-index: 50;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fffdf5;
  border-top: 1px solid #e7e0ce;
  box-shadow: 0 -5px 20px #00000008;
  display: flex;
  justify-content: space-around;
  padding: 12px 4px calc(12px + env(safe-area-inset-bottom));
}

.nav-item {
  flex: 1;
  border: none;
  background: transparent;
  color: #77756e;
  text-align: center;
  font-size: 11px;
  position: relative;
}

.nav-icon {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.badge {
  position: absolute;
  top: -4px;
  right: 18%;
  background: #cf2732;
  color: white;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  font-size: 10px;
}

.toast {
  position: fixed;
  z-index: 100;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: white;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 13px;
  display: none;
  width: max-content;
  max-width: 90%;
}

@media (min-width: 700px) {
  .container {
    box-shadow: 0 0 35px #00000008;
    min-height: 100vh;
  }

  .products {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  body {
    background: #ecebe5;
  }
}
</style>
</head>

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function money(value) {
