<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMINE DH | E-Commerce Global Store</title>

<meta name="description"
content="Découvrez AMINE DH, votre boutique en ligne pour l'électronique, les téléphones, l'informatique et les accessoires.">

<style>
:root {
  --gold: #c6a052;
  --dark: #142e3b;
  --cream: #f7f5ec;
  --white: #ffffff;
  --gray: #77766e;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cream);
  color: var(--dark);
  padding-bottom: 95px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

/* LOGO */

header {
  padding: 25px 15px 20px;
  text-align: center;
}

.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 13px;
}

.logo-symbol {
  color: var(--gold);
  font-size: 53px;
  font-weight: 900;
  letter-spacing: -5px;
}

.logo-text {
  text-align: left;
}

.logo-text h1 {
  font-size: clamp(24px, 5vw, 43px);
  font-weight: 900;
  letter-spacing: 1px;
}

.logo-text p {
  font-size: clamp(10px, 2.5vw, 16px);
  margin-top: 5px;
  letter-spacing: 1px;
}

/* SEARCH */

.search-box {
  display: flex;
  align-items: center;
  background: #fffef8;
  border: 1px solid #e0ddcf;
  border-radius: 22px;
  padding: 8px 14px;
  margin: 12px 0 20px;
  box-shadow: 0 3px 8px #0000000b;
}

.search-box input {
  width: 100%;
  padding: 15px 8px;
  border: none;
  outline: none;
  background: transparent;
  font-size: 16px;
}

.search-box button {
  background: transparent;
  border: none;
  font-size: 27px;
}

/* CATEGORIES */

.categories {
  display: flex;
  overflow-x: auto;
  gap: 0;
  scrollbar-width: thin;
  border-bottom: 1px solid #d9d4c6;
  margin-bottom: 30px;
}

.category {
  flex: 1 0 100px;
  min-width: 95px;
  padding: 12px 6px 17px;
  border: none;
  border-right: 1px solid #e2dfd4;
  background: transparent;
  color: #242424;
  font-size: 14px;
  transition: .2s;
}

.category .icon {
  display: block;
  font-size: 31px;
  margin-bottom: 10px;
}

.category.active,
.category:hover {
  background: #eee9d9;
  border-bottom: 3px solid var(--gold);
}

/* HERO BANNER */

.hero {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 410px;
  padding: 35px 25px;
  overflow: hidden;
  border-radius: 30px;
  background: linear-gradient(130deg, #426c70, #254b53);
  color: white;
  margin-bottom: 35px;
}

.hero::before {
  content: "";
  position: absolute;
  width: 230px;
  height: 550px;
  border: 3px solid #c6a052;
  border-radius: 50%;
  left: 28%;
  top: -60px;
  transform: rotate(20deg);
  opacity: .8;
}

.hero-bags {
  position: relative;
  z-index: 1;
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.bag {
  width: 105px;
  height: 145px;
  border-radius: 5px 5px 12px 12px;
  position: relative;
  box-shadow: 5px 10px 20px #00000025;
}

.bag::before {
  content: "";
  position: absolute;
  width: 38px;
  height: 45px;
  border: 5px solid currentColor;
  border-bottom: none;
  border-radius: 25px 25px 0 0;
  top: -30px;
  left: 30px;
}

.bag.pink {
  background: #d98eae;
  color: #d98eae;
  transform: rotate(-5deg);
}

.bag.green {
  background: #a8d2b0;
  color: #a8d2b0;
  height: 120px;
  transform: rotate(4deg);
}

.hero-content {
  position: relative;
  z-index: 2;
  flex: 1;
  text-align: right;
}

.hero-tag {
  display: inline-block;
  background: #21434a;
  color: #e4ca88;
  border-radius: 25px;
  padding: 12px 16px;
  margin-bottom: 25px;
  font-size: 13px;
}

.hero h2 {
  font-size: clamp(23px, 4vw, 35px);
  line-height: 1.35;
  margin-bottom: 15px;
  font-weight: 900;
}

.hero h2 span {
  color: #dfbb68;
}

.hero p {
  font-size: 16px;
  line-height: 1.6;
  color: #eeeade;
  margin-bottom: 25px;
}

.gold-button {
  display: inline-block;
  padding: 15px 20px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(120deg, #dfc17c, #bd8c35);
  color: #172b32;
  font-weight: bold;
  box-shadow: 0 5px 12px #00000025;
}

/* SECTION TITLE */

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 30px 0 20px;
  gap: 10px;
}

.section-heading h2 {
  font-size: 22px;
}

.section-heading span {
  color: var(--gold);
  font-size: 14px;
}

/* PRODUCTS */

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.product {
  background: white;
  border: 1px solid #eeebdf;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 4px 12px #00000006;
}

.product-image {
  width: 100%;
  height: 165px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0eee5;
  font-size: 65px;
}

.product-info {
  padding: 13px;
}

.product-info h3 {
  font-size: 15px;
  margin-bottom: 10px;
}

.price {
  color: #b58b37;
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 12px;
}

.product-actions {
  display: flex;
  gap: 8px;
}

.add-button {
  flex: 1;
  background: var(--dark);
  color: white;
  border: none;
  padding: 11px 5px;
  border-radius: 9px;
  font-size: 13px;
}

.wish-button {
  width: 40px;
  border: 1px solid #ddd8ca;
  background: white;
  border-radius: 9px;
  font-size: 19px;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 12px 3px max(12px, env(safe-area-inset-bottom));
  background: #fffef9;
  border-top: 1px solid #e6e1d5;
  box-shadow: 0 -5px 20px #00000008;
}

.nav-button {
  position: relative;
  flex: 1;
  border: none;
  background: transparent;
  color: #68685f;
  font-size: 12px;
  text-align: center;
}

.nav-icon {
  display: block;
  font-size: 24px;
  margin-bottom: 5px;
}

.badge {
  position: absolute;
  top: -5px;
  left: 57%;
  min-width: 20px;
  height: 20px;
  line-height: 20px;
  border-radius: 50%;
  background: #d92731;
  color: white;
  font-size: 11
